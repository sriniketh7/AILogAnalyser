spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Use a single canonical property for the Google GenAI API key and reference it where needed.
# Set this from your environment: set DB environment variables and GOOGLE_API_KEY accordingly.
spring.ai.google.genai.api-key=${GOOGLE_API_KEY}

spring.ai.google.genai.chat.options.model=gemini-3.1-flash-lite
spring.ai.google.genai.embedding.text.model=gemini-embedding-2

# Reuse the canonical API key property for embedding as well (avoids duplicating the value).
spring.ai.google.genai.embedding.api-key=${spring.ai.google.genai.api-key}

